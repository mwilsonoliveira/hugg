name: Reusable Turso Migration Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'The target environment (develop, production, etc.)'
        required: true
        type: string
    secrets:
      turso_database_url:
        required: true
      turso_auth_token:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @hugg/database db:migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.turso_database_url }}
          TURSO_AUTH_TOKEN: ${{ secrets.turso_auth_token }}
